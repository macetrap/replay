<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Replay Studio</title>
<style>
:root{color-scheme:light;--text:#242522;--muted:#6e706b;--accent:#252723;--line:#dedfd9;--paper:#f7f7f2}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--text);font:14px Arial,Helvetica,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}main{max-width:1100px;margin:auto;padding:36px 32px 70px}.masthead{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;border-bottom:1px solid #d7d9d1}.eyebrow{font:11px ui-monospace,monospace;letter-spacing:1.5px;color:#575b51}.wordmark{font-size:14px;font-weight:700;letter-spacing:-.5px}.local{display:flex;gap:7px;align-items:center;font:10px ui-monospace,monospace;color:#6b7065}.local:before{content:'';width:5px;height:5px;border-radius:50%;background:#788a5e}.hero{display:flex;justify-content:space-between;align-items:center;padding:38px 0 24px;gap:24px}h1{font-size:clamp(42px,6vw,67px);font-weight:500;letter-spacing:-3.7px;margin:11px 0 13px;line-height:1}h2{font-size:16px;font-weight:600;margin:0;letter-spacing:-.3px}p{color:var(--muted);line-height:1.65}.hero p{max-width:440px;font-size:14px;margin:0}.panel{position:relative;isolation:isolate;background:#ffffff85;border:1px solid #ffffff;border-radius:15px;padding:25px;margin-top:18px;box-shadow:0 0 0 1px #daddd57a,inset 1px 1px 0 #fff,inset -1px -1px 0 #e0e4de,0 7px 20px #26332304}.panel:before,.score:before{content:'';position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.upload{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:8px 0}.upload strong{display:block;font-size:16px;font-weight:500;letter-spacing:-.3px}.upload small{display:block;margin-top:6px}.upload-icon{width:39px;height:43px;border:1px solid #c8cdc1;border-radius:7px;display:grid;place-items:center;font:12px ui-monospace,monospace;color:#555d4e;box-shadow:inset 1px 1px #fff;flex-shrink:0}.upload-title{display:flex;gap:16px;align-items:center}input,button,select{font:inherit}input[type=file]{font-size:12px;color:#71756c;max-width:100%;width:260px}input[type=file]::file-selector-button{border:1px solid #d6dad0;border-radius:7px;background:#fcfcf9;color:#30362a;padding:10px 12px;margin-right:11px;cursor:pointer}input[type=number],select{background:#ffffffb3;color:var(--text);border:1px solid #d8dbd2;border-radius:7px;padding:9px 10px;width:100px;min-height:37px}button{background:#292d25;color:#fcfcfa;border:1px solid #292d25;border-radius:7px;padding:10px 14px;cursor:pointer;font-size:12px;font-weight:500;min-height:37px;transition:box-shadow .18s,background .18s}button.secondary{background:#ffffffa6;color:#454a3f;border-color:#d4d9cd;box-shadow:inset 0 1px #fff}button:disabled{opacity:.35;cursor:not-allowed}button:hover:enabled{background:#444b3c;box-shadow:0 3px 9px #26332312}button.secondary:hover:enabled{background:#eef0e8}button.active{background:#e6eadd;border-color:#aeb7a0;box-shadow:inset 0 1px #fff}input:invalid{border-color:#b85160}:focus-visible{outline:2px solid #7f936d;outline-offset:3px}.scores{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}.score{position:relative;isolation:isolate;background:#ffffff70;border:1px solid #fff;border-radius:14px;padding:23px 25px;box-shadow:0 0 0 1px #dde0d8,inset 1px 1px #fff,inset -1px -1px #e0e4de}.team{display:flex;align-items:center;gap:8px;font:10px ui-monospace,monospace;letter-spacing:1.4px;color:#4f6680}.team:before{content:'';width:6px;height:6px;background:#779abf;border-radius:50%}.red .team{color:#946563}.red .team:before{background:#bd817d}.score input{display:block;width:100%;font-size:48px;letter-spacing:-2px;font-weight:400;border:0;background:transparent;padding:6px 0;margin:9px 0 5px;box-shadow:none}.score input:focus{outline-offset:0}.flex{display:flex;align-items:center;gap:11px;flex-wrap:wrap}.between{justify-content:space-between}.note,small{font-size:11px;color:var(--muted);line-height:1.7}.inline{display:flex;gap:8px;align-items:center;color:#62685a;font-size:11px}.clock{text-align:center;margin:28px 0 26px}.clock strong{display:block;font-size:48px;letter-spacing:-2px;font-weight:400;font-variant-numeric:tabular-nums}.clock span{display:block;margin-top:7px;color:#7a8072;font:10px ui-monospace,monospace}input[type=range]{appearance:none;width:100%;height:4px;border-radius:4px;background:#dfe3d8;accent-color:#505d43;cursor:pointer;margin:15px 0}input[type=range]::-webkit-slider-thumb{appearance:none;width:20px;height:25px;border-radius:6px;background:#fafcf7;border:1px solid #bec7b3;box-shadow:inset 1px 1px #fff,inset -1px -1px #d7dfd0,0 2px 4px #323a2520}input[type=range]::-moz-range-thumb{width:18px;height:23px;border-radius:6px;background:#fafcf7;border:1px solid #bec7b3}.scale{display:flex;justify-content:space-between;color:#858b7c;font:10px ui-monospace,monospace;margin-top:8px}.nav{justify-content:center;margin:25px 0 10px}.panel>p.note{max-width:770px}.panel>.note:last-child{margin-bottom:0}.panel>h2+.flex{margin-top:18px}#status{white-space:pre-wrap;overflow-wrap:anywhere;font:10px ui-monospace,monospace;margin:18px 0 0;padding-top:12px;border-top:1px solid #e4e7de}#status.error{color:#a54149}#fileinfo{overflow-wrap:anywhere;font-family:ui-monospace,monospace;font-size:10px}input[type=checkbox]{accent-color:#505d43;width:15px;height:15px}.bottomline{display:flex;justify-content:space-between;margin-top:28px;padding-top:15px;border-top:1px solid #dce0d5;color:#8b9181;font:9px ui-monospace,monospace;letter-spacing:1px}.filter-defs{position:absolute;width:0;height:0;pointer-events:none;overflow:hidden}[hidden]{display:none!important}@media(max-width:600px){main{padding:23px 18px 45px}.hero{padding-top:28px}h1{font-size:43px;letter-spacing:-2px}.hero p{font-size:12px}.panel{padding:19px}.scores{gap:12px}.score{padding:18px}.score input{font-size:36px}.eyebrow{font-size:9px}.local{font-size:9px}.upload{gap:18px}input[type=file]{width:100%}.scale{font-size:8px}.nav{gap:7px}.nav button{padding:9px 10px}.nav .inline{width:100%;justify-content:center;order:2}.bottomline{font-size:8px}.clock strong{font-size:40px}}@media(prefers-reduced-transparency:reduce){.panel,.score{background:#fff}.panel:before,.score:before{backdrop-filter:none}}@media(prefers-reduced-motion:reduce){button{transition:none}}

/* Explicit typography and a clipped surface avoid distorted text and duplicate edges. */
.hero{display:block;padding:26px 0 22px}
.hero>.hero-copy{display:flex;flex-direction:column;gap:12px}
.hero .eyebrow{display:block;order:0;font:11px/1.5 ui-monospace,monospace;letter-spacing:1.5px}
.hero .hero-title{display:block;order:1;font:500 clamp(38px,5vw,58px)/1.08 Arial,Helvetica,sans-serif!important;letter-spacing:-2.5px;margin:0!important;color:#242522}
.panel,.score{overflow:hidden;background:#ffffffb8;border:1px solid #dedfd9;box-shadow:inset 0 1px 0 #fff,0 4px 16px #26332305}
.panel:before,.score:before{inset:1px;border-radius:inherit}
@media(max-width:600px){.hero .hero-title{font-size:38px!important;letter-spacing:-1.5px}}
</style>
</head>
<body>
<main>
<div class="hero"><div class="hero-copy">
<div class="eyebrow">a frs replay editor</div><h1 class="hero-title">Edit any replay</h1>
</div>
</div>
<section class="panel"><label class="upload"><span class="upload-title"><span class="upload-icon" aria-hidden="true">↥</span><span><strong>Bring in a replay</strong></span></span><input aria-label="Open a .frcreplay file" id="file" type="file" accept=".frcreplay"></label><p id="status" role="status" aria-live="polite">No replay loaded.</p></section>
<div id="workspace" hidden>
<div class="scores">
<section class="score"><label class="team" for="blue">BLUE ALLIANCE</label><input id="blue" type="number" min="0" step="1" required></section>
<section class="score red"><label class="team" for="red">RED ALLIANCE</label><input id="red" type="number" min="0" step="1" required></section>
</div>
<section class="panel"><div class="flex between"><h2>Match timeline</h2><label class="inline">Ticks / second <input id="rate" type="number" min="0.001" max="1000000" step="any" value="30" required></label></div>
<p class="note" id="fileinfo"></p><div class="clock"><strong id="clock">0:00.000</strong><span id="selection"></span></div>
<input id="timeline" type="range" min="0" max="1" step="any" value="0" aria-label="Replay timeline"><div class="scale"><span id="start"></span><span>Timeline</span><span id="end"></span></div>
<div class="flex nav"><button id="previous" class="secondary">← Previous</button><label class="inline">Seconds <input id="jump" type="number" step="any"></label><button id="next" class="secondary">Next →</button><button id="last" class="secondary">Final moment</button></div>
</section>
<section class="panel"><h2>Ball-point multiplier</h2>
<div class="flex"><button class="secondary preset active" data-factor="1">×1</button><button class="secondary preset" data-factor="2">×2</button><button class="secondary preset" data-factor="3">×3</button><button class="secondary preset" data-factor="5">×5</button><button class="secondary preset" data-factor="10">×10</button><label class="inline">Custom <input id="factor" type="number" min="1" step="1" value="1" required></label><label class="inline">Alliance <select id="scope"><option value="both">Both</option><option value="blue">Blue</option><option value="red">Red</option></select></label><button id="apply">Apply</button></div>
</section>
<section class="panel"><h2>Fast visual count-up</h2>
<div class="flex"><label class="inline"><input id="smooth" type="checkbox" checked> Enable on export</label><label class="inline">Speed <select id="speed" style="width:150px"><option value="100">Very fast · 100 ms</option><option value="150" selected>Fast · 150 ms</option><option value="250">Smooth · 250 ms</option></select></label></div>
</section>
<section class="panel flex between"><div><h2>Export replay</h2></div><div class="flex"><button id="max" class="secondary">Final blue → 9999</button><button id="download">Download replay ↓</button></div></section>
</div></main>
<script>
"use strict";
const MAGIC=[0x52,0x42,0x52,0x50], TEAMS=["blue","red"];
const clone=v=>JSON.parse(JSON.stringify(v));
const valid=v=>Number.isSafeInteger(v)&&v>=0;
const object=v=>v!==null&&typeof v==="object"&&!Array.isArray(v);
function score(entry,team){const s=entry?.[1]?.score;return object(s)&&object(s[team])?s[team]:null}
function parseReplay(buffer){
  if(!(buffer instanceof ArrayBuffer)||buffer.byteLength<9)throw Error("File is shorter than its header.");
  const bytes=new Uint8Array(buffer);
  if(!MAGIC.every((v,i)=>bytes[i]===v))throw Error("Expected RBRP magic bytes.");
  const n=new DataView(buffer).getUint32(5,true);
  if(n>bytes.length-9)throw Error("JSON length exceeds file size.");
  const data=JSON.parse(new TextDecoder("utf-8",{fatal:true}).decode(bytes.subarray(9,9+n)));
  if(!object(data)||!Array.isArray(data.metas)||!data.metas.length)throw Error("No score snapshots found.");
  for(const entry of data.metas)if(!Array.isArray(entry)||!valid(entry[0])||!object(entry[1]))throw Error("Invalid metadata snapshot.");
  return {data,version:bytes[4],payload:bytes.slice(9+n)};
}
function rebuild(data,version,payload){
  const json=new TextEncoder().encode(JSON.stringify(data));
  if(json.length>0xffffffff)throw Error("JSON exceeds Uint32 size.");
  const output=new Uint8Array(9+json.length+payload.length);
  output.set(MAGIC);output[4]=version;new DataView(output.buffer).setUint32(5,json.length,true);
  output.set(json,9);output.set(payload,9+json.length);return output;
}
function multiplyBallPoints(model,original,teams,factor){
  if(!Number.isSafeInteger(factor)||factor<1)throw Error("Use a positive whole-number multiplier.");
  const result=clone(model);let changed=0;
  for(let i=0;i<original.metas.length;i++)for(const team of teams){
    const base=score(original.metas[i],team), target=score(result.metas[i],team);
    if(!base||!target||!valid(base.total))continue;
    if(!valid(base.autoFuel)||!valid(base.teleFuel))throw Error("Replay lacks the expected ball-point fields. Manual editing is still available.");
    const autoFuel=base.autoFuel*factor,teleFuel=base.teleFuel*factor;
    const total=base.total+(autoFuel-base.autoFuel)+(teleFuel-base.teleFuel);
    if(!valid(autoFuel)||!valid(teleFuel)||!valid(total))throw Error("Multiplier exceeds safe score limits.");
    Object.assign(target,{...base,autoFuel,teleFuel,total});changed++;
  }
  if(Array.isArray(original.events)&&Array.isArray(result.events))original.events.forEach((entry,i)=>{
    const event=entry?.[1];if(event?.t!=="score"||!teams.includes(event.alliance)||!valid(event.points)||!Object.hasOwn(event,"fuel"))return;
    const points=event.points*factor;if(!valid(points))throw Error("Event points exceed safe score limits.");
    result.events[i][1].points=points;
  });
  syncSummary(result,teams);return {data:result,changed};
}
function syncSummary(data,teams=TEAMS){
  const sorted=data.metas.slice().sort((a,b)=>a[0]-b[0]);
  for(const team of teams){const total=score(sorted.at(-1),team)?.total;
    if(valid(total)&&object(data.meta?.score)&&typeof data.meta.score[team]==="number")data.meta.score[team]=total;
  }
}
function smoothReplay(source,hz,milliseconds){
  const result=clone(source),sorted=result.metas.slice().sort((a,b)=>a[0]-b[0]);
  const output=[];let previous={};
  const burst=Math.max(1,Math.round(hz*milliseconds/1000));
  const lastTick=Number.isFinite(result.durationMs)?Math.floor(result.durationMs*hz/1000):null;
  for(let i=0;i<sorted.length;i++){
    const entry=sorted[i],tick=entry[0],next=sorted[i+1]?.[0],targets={},from={};let increase=false;
    for(const team of TEAMS){const target=score(entry,team)?.total;targets[team]=target;
      const rising=valid(target)&&valid(previous[team])&&target>previous[team];
      from[team]=rising?previous[team]:target;increase ||= rising;
    }
    let end=tick+burst;
    if(Number.isFinite(next))end=Math.min(end,next-1);
    if(lastTick!==null)end=Math.min(end,lastTick);else if(i===sorted.length-1)end=tick;
    const steps=Math.max(0,end-tick);
    if(!increase||!steps)output.push(entry);
    else for(let step=0;step<=steps;step++){
      const frame=clone(entry);frame[0]=tick+step;
      for(const team of TEAMS)if(valid(from[team])&&valid(targets[team])){
        const delta=targets[team]-from[team];
        // Whole points per tick, batching automatically for large increases.
        score(frame,team).total=from[team]+Math.ceil(delta*(step+1)/(steps+1));
      }
      output.push(frame);
    }
    previous=targets;
  }
  result.metas=output;return result;
}
if(typeof document!=="undefined"){
const $=id=>document.getElementById(id);
let model=null,original=null,payload=null,version=0,points=[],selected=0,sequence=0;
function message(text,error=false){$("status").textContent=text;$("status").classList.toggle("error",error)}
function rate(){return $("rate").checkValidity()?$("rate").valueAsNumber:null}
function invalidEdit(){return TEAMS.some(t=>!$(t).disabled&&!$(t).checkValidity())}
function format(seconds){const ms=Math.round(seconds*1000);return `${Math.floor(ms/60000)}:${String(Math.floor(ms/1000)%60).padStart(2,"0")}.${String(ms%1000).padStart(3,"0")}`}
function update(){const invalid=invalidEdit();$("download").disabled=!model||invalid||($("smooth").checked&&!rate());$("previous").disabled=invalid||selected===0;$("next").disabled=invalid||selected===points.length-1;$("last").disabled=invalid;$("timeline").disabled=invalid||!rate()||points.length<2;$("jump").disabled=invalid||!rate();$("max").disabled=invalid||!valid(score(points.at(-1),"blue")?.total);$("apply").disabled=invalid||!$("factor").checkValidity()||!Number.isSafeInteger($("factor").valueAsNumber)}
function refreshPoints(){points=model.metas.slice().sort((a,b)=>a[0]-b[0])}
function render(){const point=points[selected];if(!point)return;const hz=rate();$("clock").textContent=hz?format(point[0]/hz):"Set tick rate";$("selection").textContent=`${selected+1} / ${points.length}`;
if(hz){const first=points[0][0]/hz,last=points.at(-1)[0]/hz;$("timeline").min=first;$("timeline").max=last>first?last:first+1;$("timeline").value=point[0]/hz;$("timeline").setAttribute("aria-valuetext",format(point[0]/hz));$("jump").min=first;$("jump").max=last;$("jump").value=point[0]/hz;$("start").textContent=format(first);$("end").textContent=format(last)}
for(const team of TEAMS){const total=score(point,team)?.total,input=$(team);input.setCustomValidity("");input.disabled=!valid(total);input.max=Number.MAX_SAFE_INTEGER;input.value=valid(total)?total:""}update()}
function select(index){if(invalidEdit())return;selected=Math.max(0,Math.min(points.length-1,index));render()}
function seek(seconds){const hz=rate();if(!hz||!Number.isFinite(seconds)||invalidEdit())return;const tick=seconds*hz;let lo=0,hi=points.length-1;while(lo<hi){const mid=Math.floor((lo+hi)/2);if(points[mid][0]<tick)lo=mid+1;else hi=mid}if(lo>0&&Math.abs(points[lo-1][0]-tick)<=Math.abs(points[lo][0]-tick))lo--;select(lo)}
function presets(){document.querySelectorAll("[data-factor]").forEach(b=>{const active=Number(b.dataset.factor)===$("factor").valueAsNumber;b.classList.toggle("active",active);b.setAttribute("aria-pressed",String(active))})}
$("file").addEventListener("change",()=>{const request=++sequence,file=$("file").files[0];model=null;original=null;payload=null;points=[];selected=0;$("workspace").hidden=true;if(!file){message("No replay loaded.");return}message("Reading replay…");const reader=new FileReader();reader.onerror=()=>{if(request===sequence)message("Could not read file.",true)};reader.onload=()=>{if(request!==sequence)return;try{const parsed=parseReplay(reader.result);model=parsed.data;original=clone(model);payload=parsed.payload;version=parsed.version;refreshPoints();$("factor").value=1;$("scope").value="both";presets();$("fileinfo").textContent=file.name;$("workspace").hidden=false;render();message("Replay loaded.")}catch(e){model=null;message("Cannot open replay: "+e.message,true)}};reader.readAsArrayBuffer(file)});
for(const team of TEAMS)$(team).addEventListener("input",()=>{const input=$(team),value=input.valueAsNumber;input.setCustomValidity("");if(!valid(value))input.setCustomValidity("Enter a nonnegative safe integer.");if(input.checkValidity()){score(points[selected],team).total=value;syncSummary(model)}update()});
$("timeline").addEventListener("input",e=>seek(Number(e.target.value)));$("jump").addEventListener("change",e=>{seek(e.target.valueAsNumber);if(!invalidEdit())render()});$("rate").addEventListener("input",()=>{if(!invalidEdit())render();else update()});$("smooth").addEventListener("change",update);$("previous").addEventListener("click",()=>select(selected-1));$("next").addEventListener("click",()=>select(selected+1));$("last").addEventListener("click",()=>select(points.length-1));
document.querySelectorAll("[data-factor]").forEach(b=>b.addEventListener("click",()=>{$("factor").value=b.dataset.factor;presets();update()}));$("factor").addEventListener("input",()=>{presets();update()});
$("apply").addEventListener("click",()=>{update();if($("apply").disabled)return;try{const teams=$("scope").value==="both"?TEAMS:[$("scope").value];const applied=multiplyBallPoints(model,original,teams,$("factor").valueAsNumber);model=applied.data;refreshPoints();render();message(`Multiplier ×${$("factor").value} applied.`)}catch(e){message(e.message,true)}});
$("max").addEventListener("click",()=>{if(invalidEdit())return;const target=score(points.at(-1),"blue");if(!valid(target?.total))return;target.total=9999;syncSummary(model);select(points.length-1);message("Final blue score set to 9999.")});
$("download").addEventListener("click",()=>{update();if($("download").disabled)return;try{const data=$("smooth").checked?smoothReplay(model,rate(),Number($("speed").value)):clone(model);syncSummary(data);const output=rebuild(data,version,payload);const url=URL.createObjectURL(new Blob([output],{type:"application/octet-stream"}));const a=document.createElement("a");a.href=url;a.download="edited_replay.frcreplay";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);message("Replay exported.")}catch(e){message("Export failed: "+e.message,true)}});
}
</script></body></html>
